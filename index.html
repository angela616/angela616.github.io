<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>偶像专属小站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cutePink: '#FFE6EF',
                        cuteDeeperPink: '#F8BBD0',
                        textPeep: '#803958'
                    },
                    fontFamily: {
                        cute: ['system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .box-shadow-soft {
                box-shadow: 0 4px 12px rgba(248, 187, 208,0.35);
            }
            .img-hover {
                transition: all 0.3s ease;
            }
            .img-hover:hover {
                transform: translateY(-6px);
                box-shadow: 0 8px 18px rgba(248,187,208,0.45);
            }
        }
    </style>
</head>
<body class="bg-[#FFF7FA] font-cute text-[#803958] p-6 md:p-10">
    <div class="max-w-6xl mx-auto">
        <div class="text-center mb-10">
            <h1 class="text-[clamp(2rem,5vw,3rem)] font-bold mb-3">✨ 我的追星小角落 ✨</h1>
            <p class="text-lg opacity-80">收集所有心动瞬间</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- 照片卡片，复制整块可以新增更多图片 -->
            <div class="rounded-2xl overflow-hidden bg-white box-shadow-soft img-hover">
                <img src="这里替换成图片网络链接" class="w-full h-72 object-cover">
                <p class="py-3 text-center">照片标题</p>
            </div>
        </div>
    </div>
</body>
</html>
